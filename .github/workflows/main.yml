name: Unzip File

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the zip file in the repo"
        required: true
        default: "archive.zip"
      output_dir:
        description: "Folder to extract into"
        required: true
        default: "extracted"
      delete_zip:
        description: "Delete the zip file after extracting?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    env:
      ZIP_PATH: ${{ inputs.zip_path }}
      OUTPUT_DIR: ${{ inputs.output_dir }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p "$OUTPUT_DIR"
          unzip -o "$ZIP_PATH" -d "$OUTPUT_DIR"

      - name: Delete zip (optional)
        if: ${{ inputs.delete_zip }}
        run: git rm -f "$ZIP_PATH"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unzip $ZIP_PATH into $OUTPUT_DIR"
          git push
